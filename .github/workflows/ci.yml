name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby:
    name: Ruby contract suite (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      # Let each Ruby finish so a 4.0-only failure is visible as exactly that
      fail-fast: false
      matrix:
        # No stable 3.5 exists: Ruby went 3.4.x -> 4.0 (Dec 2025)
        ruby: ['3.3', '3.4', '4.0']
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true   # bundle install + cache keyed on Gemfile.lock
      - name: Contract + security + login-gate suites (try/)
        run: bundle exec try --agent try/

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      # Must precede setup-node so `cache: pnpm` finds pnpm on PATH. Version is
      # auto-detected from package.json "packageManager" — do not pin here too.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Typecheck + production build (emits the /login SPA)
        run: pnpm build
