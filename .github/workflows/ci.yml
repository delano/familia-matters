name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby:
    name: Ruby contract suite
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true   # bundle install + cache keyed on Gemfile.lock
      - name: Contract + security + login-gate suites (try/)
        run: bundle exec try --agent try/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Typecheck + production build (emits the /login SPA)
        run: npm run build
      - name: Prototype client adapter tests
        run: node resources/01-designs/prototype/backend-client.test.mjs
